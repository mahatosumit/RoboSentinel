name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install from the offline lockfile
        run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify deterministic scenarios
        run: npm run demo

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build a clean image
        run: docker build --pull --no-cache --tag robosentinel:ci .
      - name: Verify the image offline
        run: docker run --rm --network none robosentinel:ci npm run verify
      - name: Smoke test the default image
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::3000 robosentinel:ci)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs "$container"; fi
            docker rm --force "$container" > /dev/null
            exit "$status"
          }
          trap cleanup EXIT

          test "$(docker exec "$container" id -u)" -ne 0
          for attempt in {1..45}; do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$health" = healthy ]; then break; fi
            if [ "$health" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          test "$health" = healthy

          port=$(docker port "$container" 3000/tcp)
          for path in / /replay.html /src/incident.js; do
            curl --fail --silent --show-error --max-time 10 "http://$port$path" > /dev/null
          done
